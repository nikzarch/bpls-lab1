spring:
  application:
    name: labpay
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        transaction:
          coordinator_class: jta
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.AtomikosJtaPlatform
      jakarta:
        persistence:
          transactionType: JTA
  jta:
    enabled: true
    atomikos:
      properties:
        service: labpay
        max-timeout: 300000
        default-jta-timeout: 30000
  jms:
    pub-sub-domain: false
  datasource:
    xa:
      data-source-class-name: org.postgresql.xa.PGXADataSource
      properties:
        serverName: localhost
        portNumber: 5433
        databaseName: postgres
        user: postgres
        password: 1


springdoc:
  api-docs:
    path: /api/api-docs

rabbit:
