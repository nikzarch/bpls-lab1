spring:
  application:
    name: labpay

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        transaction:
          coordinator_class: jta
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.AtomikosJtaPlatform
      jakarta:
        persistence:
          transactionType: JTA

  jta:
    enabled: true
    atomikos:
      properties:
        service: labpay
        max-timeout: 300000
        default-jta-timeout: 30000
        enable-logging: true

      datasource:
        unique-resource-name: labpayDataSource
        min-pool-size: 5
        max-pool-size: 60
        borrow-connection-timeout: 60
        reap-timeout: 30
        max-idle-time: 60
        maintenance-interval: 60
        test-query: SELECT 1

  datasource:
    xa:
      data-source-class-name: org.postgresql.xa.PGXADataSource
      properties:
        serverName: ${SPRING_DATASOURCE_XA_PROPERTIES_SERVERNAME:localhost}
        portNumber: ${SPRING_DATASOURCE_XA_PROPERTIES_PORTNUMBER:5433}
        databaseName: ${SPRING_DATASOURCE_XA_PROPERTIES_DATABASENAME:postgres}
        user: ${SPRING_DATASOURCE_XA_PROPERTIES_USER:postgres}
        password: ${SPRING_DATASOURCE_XA_PROPERTIES_PASSWORD:1}

  jms:
    pub-sub-domain: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      isolation-level-for-create: DEFAULT

springdoc:
  api-docs:
    path: /api/api-docs

rabbit:
  host: ${RABBIT_HOST:localhost}
  port: ${RABBIT_PORT:5672}
  username: ${RABBIT_USERNAME:admin}
  password: ${RABBIT_PASSWORD:admin}

app:
  bank:
    request-queue: bank.requests
    reply-queue: bank.responses
    receive-timeout-ms: 5000
    connect-timeout-ms: 2000

  jms:
    url: ${APP_JMS_URL:amqp://localhost:5672}

  jwt:
    secret: "nobodygonnastealmyjwtsecretisnthe1234567"
    expiration-ms: 3600000

  card:
    encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  webhook:
    secret: "webhook-hmac-secret-key-change-me"

  security:
    users-xml-path: file:./users.xml

  bitrix:
    base-url: ${BITRIX_BASE_URL:}
    external-order-field: UF_CRM_1778872223
    source-id: WEB
    stage-id: NEW
    currency-id: RUB
    responsible-user-id: 1
    timeout-ms: 10000

  batch:
    chunk-size: 25

    bank-reconciliation:
      cron: "0 */1 * * * *"
      max-attempts: 30

    card-session-cleanup:
      cron: "0 */5 * * * *"

    hold-expiration:
      cron: "0 */1 * * * *"

    stuck-transfer:
      cron: "0 */10 * * * *"
      cutoff-minutes: 30

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
      firstName: Admin

    filter:
      create: All tasks

    auto-deployment-enabled: true

    deployment-resource-pattern:
      - classpath*:**/*.bpmn
      - classpath*:**/*.form

    history-level: full

    authorization:
      enabled: true
      authorization-check-revokes: auto

    job-execution:
      enabled: true
      core-pool-size: 1
      max-pool-size: 2
      queue-size: 3
      max-jobs-per-acquisition: 1
      wait-time-in-millis: 5000
      lock-time-in-millis: 300000

logging:
  level:
    com.atomikos: INFO
    com.atomikos.jdbc: DEBUG
    com.atomikos.spring: DEBUG
    org.springframework.transaction: INFO
    org.hibernate.engine.transaction: INFO
    org.camunda.bpm.engine: INFO
