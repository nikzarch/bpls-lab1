spring:
  application:
    name: labpay
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        transaction:
          coordinator_class: jta
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.AtomikosJtaPlatform
      jakarta:
        persistence:
          transactionType: JTA
  jta:
    enabled: true
    atomikos:
      properties:
        service: labpay
        max-timeout: 300000
        default-jta-timeout: 30000
  jms:
    pub-sub-domain: false
  datasource:
    xa:
      max-pool-size: 25
      data-source-class-name: org.postgresql.xa.PGXADataSource
      properties:
        serverName: localhost
        portNumber: 5433
        databaseName: postgres
        user: postgres
        password: 1
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      isolation-level-for-create: DEFAULT

springdoc:
  api-docs:
    path: /api/api-docs

rabbit:
  host: localhost
  port: 5672
  username: admin
  password: admin

app:
  bank:
    request-queue: bank.requests
    reply-queue: bank.responses
    receive-timeout-ms: 5000
    connect-timeout-ms: 2000
  jms:
    url: amqp://localhost:5672
  jwt:
    secret: "nobodygonnastealmyjwtsecretisnthe1234567"
    expiration-ms: 3600000
  card:
    encryption-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  webhook:
    secret: "webhook-hmac-secret-key-change-me"
  security:
    users-xml-path: file:./users.xml
  bitrix:
    base-url: ${BITRIX_BASE_URL:}
    external-order-field: UF_CRM_1778872223
    source-id: WEB
    stage-id: NEW
    currency-id: RUB
    responsible-user-id: 1
    timeout-ms: 10000
  batch:
    chunk-size: 200
    bank-reconciliation:
      cron: "0 */1 * * * *"
      max-attempts: 30
    card-session-cleanup:
      cron: "0 */5 * * * *"
    hold-expiration:
      cron: "0 */1 * * * *"
    stuck-transfer:
      cron: "0 */10 * * * *"
      cutoff-minutes: 30

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
      firstName: Admin

    filter:
      create: All tasks

    auto-deployment-enabled: true

    history-level: full

    authorization:
      enabled: false

    job-execution:
      enabled: true