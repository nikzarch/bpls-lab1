plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework:spring-jms'
	implementation 'org.apache.qpid:qpid-jms-client:2.10.0'
	implementation 'jakarta.resource:jakarta.resource-api:2.1.0'
	implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	implementation 'com.atomikos:transactions-spring-boot3-starter:6.0.0'

	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
	implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.7'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

task bankRar(type: Jar) {
    description = 'Builds Jakarta Connectors RAR archive for the bank resource adapter'
    group = 'build'

    archiveExtension = 'rar'
    archiveBaseName = 'bank-ra'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('rar')

    dependsOn classes

    from(sourceSets.main.output) {
        include 'com/example/bankra/**'
    }

    from('src/main/resources/META-INF') {
        include 'ra.xml'
        into 'META-INF'
    }

    into('lib') {
        from configurations.runtimeClasspath.filter { f ->
            f.name.startsWith('jackson-databind') ||
            f.name.startsWith('jackson-core') ||
            f.name.startsWith('jackson-annotations') ||
            f.name.startsWith('jakarta.resource-api') ||
            f.name.startsWith('jakarta.jms-api') ||
            f.name.startsWith('qpid-jms-client') ||
            f.name.startsWith('proton-j') ||
            f.name.startsWith('netty-')
        }
    }
}

build.dependsOn bankRar